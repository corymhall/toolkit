[metadata]
name = "rex-repos"
description = "Browse local Git repositories and launch Rex session actions"

[source]
command = '''python3 "$REX_PICKER_ROOT/picker.py" repos'''
display = "{split:\t:0}  [{split:\t:1}]  {split:\t:2}"
output = "{split:\t:3}"
watch = 10.0
no_sort = false
frecency = false

[preview]
command = '''python3 "$REX_PICKER_ROOT/picker.py" project-preview {split:\t:3} {split:\t:5}'''
header = "{split:\t:0}"
footer = "{split:\t:0} [{split:\t:1}]"

[ui]
input_header = "Repos"

[ui.preview_panel]
size = 60

[keybindings]
enter = "actions:workspace"
ctrl-w = "actions:worktrees"
ctrl-g = "actions:create_worktree"

[actions.workspace]
description = "Create or focus Rex session"
command = '''python3 "$REX_PICKER_ROOT/picker.py" open-project {split:\t:3} {split:\t:4} {split:\t:5}'''
mode = "execute"

[actions.worktrees]
description = "List worktrees or scratch sessions"
command = '''python3 "$REX_PICKER_ROOT/picker.py" browse-project {split:\t:3} {split:\t:4} {split:\t:5}'''
mode = "execute"

[actions.create_worktree]
description = "Create a worktree or scratch session workspace"
command = '''python3 "$REX_PICKER_ROOT/picker.py" create-project-child {split:\t:3} {split:\t:5}'''
mode = "execute"
