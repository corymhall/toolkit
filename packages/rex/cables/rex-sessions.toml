[metadata]
name = "rex-sessions"
description = "Browse and focus tabs across Rex sessions"

[source]
command = '''python3 "$REX_PICKER_ROOT/picker.py" sessions'''
display = "{split:\t:0}"
output = "{split:\t:6}"
watch = 1.0
no_sort = false
frecency = false

[preview]
command = '''python3 "$REX_PICKER_ROOT/picker.py" session-preview {split:\t:3} {split:\t:6}'''
header = "{split:\t:1} [{split:\t:2}]"
footer = "#{split:\t:4}  {split:\t:5}"

[ui]
input_header = "Repository tabs"

[ui.preview_panel]
size = 60

[keybindings]
enter = "actions:workspace"

[actions.workspace]
description = "Focus selected checkout tab"
command = '''python3 "$REX_PICKER_ROOT/picker.py" select-session {split:\t:3} {split:\t:6}'''
mode = "execute"
