min_version = "2026.10.23"

[settings]
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64", "macos-x64"]

[env]
HK_MISE = "1"

[tools]
# hk no longer publishes Intel macOS binaries.
hk = { version = "1.51.0", os = ["linux", "macos/arm64"] }
node = "26.5.0"
bun = "1.3.13"
python = "3.13.14"
uv = "0.12.10"
"pipx:apm-cli" = "0.25.0"
"pipx:skills-ref" = "0.1.1"
shellcheck = "0.11.0"
go = "1.26.10"

[deps.npm]
auto = true
run = "npm ci"

[tasks.test]
description = "Run the extension test suite"
run = "npm test"

[tasks."format:check"]
description = "Check extension TypeScript formatting"
run = "npm run format:check"

[tasks."lint:typescript"]
description = "Lint and type-check extension TypeScript"
run = "npm run lint"

[tasks."lint:shell"]
description = "Lint repository and skill shell scripts"
run = "find scripts extensions skills -type f -name '*.sh' -print0 | xargs -0 shellcheck"

[tasks."lint:skills"]
description = "Validate skills against the Agent Skills specification"
run = "uv run --script scripts/lint-skills.py"

[tasks."check:repository"]
description = "Check repository-specific skill and source policies"
run = "uv run --script scripts/check-repository.py"

[tasks."check:skill-invocation"]
description = "Check cross-harness skill invocation metadata"
run = "uv run --script scripts/sync-skill-invocation.py --check"

[tasks."check:local-install"]
description = "Check live skill links and the memory guard proxy"
run = "scripts/check-local-install.sh"

[tasks."check:hooks"]
description = "Validate the hk Git lifecycle configuration"
run = "hk config dump >/dev/null"

[tasks."hooks:install"]
description = "Install Git 2.54+ global hk hooks through mise"
# Global config hooks are no-ops without hk.pkl. --mise makes hook commands use
# `mise x`, so each repository resolves its own pinned hk and validation tools.
run = "hk install --global --mise"

[tasks."test:integration"]
description = "Test skill helpers, local installation, memory guard, and the Pi package"
run = '''
scripts/test-local-installer.sh
scripts/test-sync-skill-invocation.sh
scripts/test-memory-guard.sh
scripts/test-pi-package.sh
'''

[tasks.validate]
description = "Run all repository validation"
depends = ["format:check", "lint:typescript", "lint:shell", "lint:skills", "check:repository", "check:skill-invocation", "check:hooks", "test", "test:integration", "herdr:test", "herdr:lint"]

[tasks.build]
description = "Prepare the local checkout and run all repository validation"
run = '''
set -eu
uv run --script scripts/sync-skill-invocation.py
scripts/install-local-skills.sh
scripts/check-local-install.sh
mise run validate
'''

[tasks."herdr:test"]
description = "Test workbench policy, safe installation, and GitHub collection"
run = '''
set -eu
node --test herdr/test/*.test.js
python3 -m unittest discover -s herdr/test -p 'test_*.py'
GOWORK=off go -C herdr/github-status test ./...
'''

[tasks."herdr:lint"]
description = "Check Herdr source formatting, JavaScript, shell, and Go"
run = '''
set -eu
npm exec -- oxfmt --check herdr
npm exec -- oxlint --config herdr/.oxlintrc.json herdr/mods herdr/test
shellcheck herdr/scripts/*.sh
test -z "$(gofmt -l herdr/github-status)"
GOWORK=off go -C herdr/github-status vet ./...
'''

[tasks."herdr:check"]
description = "Render workbench with Herdr-app in an isolated temporary home"
run = "python3 herdr/scripts/check-mod.py"

[tasks."herdr:build"]
description = "Build the workbench GitHub collector"
run = '''
set -eu
mkdir -p .build/herdr
GOWORK=off go -C herdr/github-status build -o ../../.build/herdr/herdr-github-status ./cmd/herdr-github-status
'''

[tasks."herdr:install"]
description = "Link toolkit-owned Herdr assets without activating them"
depends = ["herdr:build", "herdr:test", "herdr:check"]
run = "bash herdr/scripts/install.sh"

[tasks."herdr:check-install"]
description = "Check toolkit-owned Herdr links without changing them"
run = "bash herdr/scripts/install.sh --check"

[tasks."herdr:service-install"]
description = "Install the collector launchd definition without starting it"
run = "python3 herdr/scripts/service.py install"

[tasks."herdr:service-start"]
description = "Explicitly start the installed collector service"
run = "python3 herdr/scripts/service.py start"

[tasks."herdr:service-stop"]
description = "Stop the toolkit collector service only"
run = "python3 herdr/scripts/service.py stop"

[tasks."herdr:service-status"]
description = "Inspect the toolkit collector service"
run = "python3 herdr/scripts/service.py status"

[tasks."skills:list"]
description = "List project-managed Agent Skills"
run = "apm deps tree"

[tasks."skills:sync-invocation"]
description = "Synchronize cross-harness skill invocation metadata"
run = "uv run --script scripts/sync-skill-invocation.py"

[tasks."skills:update"]
description = "Update project-managed Agent Skills and reapply local invocation policy"
run = '''
set -eu
apm update --yes
uv run --script scripts/sync-skill-invocation.py
'''
