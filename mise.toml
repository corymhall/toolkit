min_version = "2026.10.23"
monorepo_root = true

[monorepo]
config_roots = ["packages/*"]

[monorepo.projects."custom:toolkit"]
root = "."

[monorepo.projects."custom:rex"]
root = "packages/rex"
depends_add = ["custom:toolkit"]

[monorepo.projects."node:@corymhall/pi-toolkit"]
depends_add = ["custom:rex", "custom:toolkit"]

[monorepo.projects."node:@corymhall/agent-config"]
depends_add = ["custom:toolkit"]

[settings]
experimental = true
task.source_freshness_hash_contents = true
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64", "macos-x64"]

[env]
HK_MISE = "1"

[tools]
# hk no longer publishes Intel macOS binaries.
hk = { version = "1.51.0", os = ["linux", "macos/arm64"] }
node = "26.5.0"
python = "3.13.14"
uv = "0.12.10"
"pipx:apm-cli" = "0.25.0"
"pipx:skills-ref" = "0.1.1"
shellcheck = "0.11.0"
go = "1.26.5"
golangci-lint = "2.15.0"

[deps.npm]
auto = true
run = "npm ci"
sources = ["package.json", "package-lock.json", "packages/*/package.json"]

[tasks.test]
description = "Run package behavioral tests"
depends = ["//packages/...:test", "test:go"]

[tasks."format:check"]
description = "Check package formatting"
depends = ["//packages/...:format:check"]

[tasks."lint:typescript"]
description = "Lint package TypeScript"
depends = ["//packages/pi:lint"]

[tasks."lint:shell"]
description = "Lint repository and skill shell scripts"
run = "find scripts packages/pi/extensions skills -type f -name '*.sh' -print0 | xargs -0 shellcheck"

[tasks."lint:skills"]
description = "Validate skills against the Agent Skills specification"
run = "node scripts/lint-skills.ts"

[tasks."check:repository"]
description = "Check repository-specific skill and source policies"
run = "node scripts/check-repository.ts"

[tasks."check:skill-invocation"]
description = "Check cross-harness skill invocation metadata"
run = "node scripts/sync-skill-invocation.ts --check"

[tasks."check:hooks"]
description = "Validate the hk Git lifecycle configuration"
run = "hk config dump >/dev/null"

[tasks."hooks:install"]
description = "Install Git 2.54+ global hk hooks through mise"
# Global config hooks are no-ops without hk.pkl. --mise makes hook commands use
# `mise x`, so each repository resolves its own pinned hk and validation tools.
run = "hk install --global --mise"

# Native bootstrap does not discover qualified monorepo task names yet.
[bootstrap.hooks.final]
run = "mise run //packages/agent-config:apply"

[tasks."memory-guard:test"]
description = "Test the memory limiter runtime"
run = "python3 -B skills/memory-guard/scripts/test_memrun.py"

[tasks.validate]
description = "Run all repository validation"
depends = ["check", "test", "memory-guard:test"]

[tasks.check]
description = "Run repository and package checks"
depends = ["//packages/...:check", "check:tooling", "lint:go", "lint:shell", "lint:skills", "check:repository", "check:skill-invocation", "check:hooks"]

[tasks."check:tooling"]
description = "Format-check and lint repository TypeScript tooling"
run = ["npm exec -- oxfmt --check scripts", "npm exec -- oxlint scripts"]

[tasks."lint:go"]
description = "Check Go formatting, safety, and modernization"
run = "golangci-lint run ./..."

[tasks."format:go"]
description = "Format Go source"
run = "golangci-lint fmt ./..."

[tasks."test:go"]
description = "Run Go behavioral tests"
run = "go test ./..."

[tasks.build]
description = "Build the toolkit CLI"
depends = ["lint:go", "test:go"]
run = "mkdir -p .build && go build -o .build/toolkit ."

[tasks."install:toolkit"]
description = "Install the toolkit CLI into the user bin directory"
depends = ["build"]
run = 'install -m 0755 .build/toolkit "$HOME/.local/bin/toolkit"'

[tasks."skills:list"]
description = "List project-managed Agent Skills"
run = "apm deps tree"

[tasks."skills:sync-invocation"]
description = "Synchronize cross-harness skill invocation metadata"
run = "node scripts/sync-skill-invocation.ts"

[tasks."skills:update"]
description = "Update project-managed Agent Skills and reapply local invocation policy"
run = '''
set -eu
apm update --yes
node scripts/sync-skill-invocation.ts
'''

[dotfiles]
"~/.config/ghostty" = "dotfiles/config/ghostty"
"~/.config/git" = "dotfiles/config/git"
"~/.config/glances" = "dotfiles/config/glances"
"~/.config/homebrew" = "dotfiles/config/homebrew"
